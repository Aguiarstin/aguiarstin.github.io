# Publica o site no GitHub Pages (https://aguiarstin.github.io) a cada
# push na main. O app fica em frontend/ e e Vite, entao precisa de build
# antes de publicar: o job de build gera frontend/dist e o de deploy
# entrega esse pacote pro Pages.
#
# VITE_GA_ID vem das variaveis do repositorio (Settings > Secrets and
# variables > Actions > Variables). Vazio = Google Analytics desligado.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo nao cancela o que ja esta publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
